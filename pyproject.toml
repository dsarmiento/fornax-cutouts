[project]
name = "fornax-cutouts"
version = "0.1.1"
description = "NASA Fornax Cutouts - Pluggable backend for Async FITS cutouts with FastAPI + Celery using the IVOA UWS standard"
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "MAST Developers", email = "archive@stsci.edu" }]
requires-python = ">=3.12"
keywords = [
    "astronomy",
    "cutouts",
    "astrocut",
    "fastapi",
    "celery",
    "fits",
    "asdf",
    "ivoa",
    "uws",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Celery",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "astrocut>=1.4.0",
    "celery>=5.5.0",
    "click>=8.3.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115.0",
    "fastapi-utils>=0.8.0",
    "httpx>=0.28.1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.11.0",
    "redis>=6.2",
    "typing-inspect>=0.9.0",
    "uvicorn[standard]>=0.37.0",
    "vo-models>=0.5.0",
    "duckdb>=1.4.1",
    "pyarrow>=20.0.0",
    "pandas>=2.3.3",
]

[project.urls]
Homepage = "https://github.com/nasa-fornax/fornax-cutouts"
Documentation = "https://nasa-fornax.github.io/fornax-cutouts/"
Repository = "https://github.com/nasa-fornax/fornax-cutouts"
Issues = "https://github.com/nasa-fornax/fornax-cutouts/issues"
Changelog = "https://github.com/nasa-fornax/fornax-cutouts/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "test" },
    "isort>=7.0.0",
    "pre-commit>=4.3.0",
    "pyarrow-stubs>=20.0.0.20250928",
    "ruff>=0.14.1",
]
test = [
    "fakeredis[json]>=2.37.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
fornax-cutouts = "fornax_cutouts.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.lint]
extend-select = ["C", "I", "FAST", "RUF"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
